name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Assemble the debug APKs (both store flavors)
        run: ./gradlew :androidApp:assembleDebug

      - name: Run the unit tests
        run: ./gradlew allTests

      # ktlintCheck must stay here: `build` skips the root :ktlintKotlinScriptCheck (M0.4).
      - name: Run detekt and ktlint
        run: ./gradlew detekt ktlintCheck

      - name: Generate Kover XML report
        run: ./gradlew koverXmlReport

      - name: Upload Kover XML report
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: '**/build/reports/kover/report.xml'
